<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME%</title>
    <meta name="description" content="%APP_NAME%: exam countdowns and a time-blocked day, fully on your phone." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html{background:#f5f5f7}
      html[data-theme="light"]{background:#f5f5f7}
      html[data-theme="dark"]{background:#000}
      @media (prefers-color-scheme:dark){html{background:#000}}
      /* the start-up screen: the logo spins until the app is ready (also used by the in-app loading state) */
      .boot{position:fixed;inset:0;display:grid;place-items:center;color:#111;animation:boot-in .35s ease-out both}
      @media (prefers-color-scheme:dark){.boot{color:#fff}}
      html[data-theme="light"] .boot{color:#111}
      html[data-theme="dark"] .boot{color:#fff}
      .boot-logo{animation:boot-spin 1.1s cubic-bezier(.65,0,.35,1) infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.boot-logo{animation:none}.boot{animation:none}}
      .boot.again{animation:none}
    </style>
  </head>
  <body>
    <script>try{var t=localStorage.getItem('dayfold-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var a=localStorage.getItem('dayfold-accent');if(a&&/^#[0-9a-f]{6}$/i.test(a))document.documentElement.style.setProperty('--accent',a)}catch(e){}</script>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <svg class="boot-logo" width="76" height="76" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="51.8 17.3" transform="rotate(-90 16 16)" />
          <circle cx="8.2" cy="8.2" r="2.4" fill="var(--accent, #e5322d)" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
