<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME%</title>
    <meta name="description" content="%APP_NAME%: exam countdowns and a time-blocked day, fully on your phone." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html{background:#f5f5f7}
      html[data-theme="light"]{background:#f5f5f7}
      html[data-theme="dark"]{background:#000}
      @media (prefers-color-scheme:dark){html{background:#000}}
      /* the start-up screen. Everything is timed as a share of --boot-s (startupSeconds in app.config.json), so any length plays smoothly:
         the ring draws itself, the dot pops in and the mark turns slowly, the glow breathes, the name rises, a bar fills and short lines fade in turn.
         Tap to skip. The in-app loading state reuses .boot and .boot-logo. */
      html{--boot-s:%STARTUP_S%s}
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#111;animation:boot-in .8s ease-out both}
      @media (prefers-color-scheme:dark){.boot{color:#fff}}
      html[data-theme="light"] .boot{color:#111}
      html[data-theme="dark"] .boot{color:#fff}
      .boot-mark{position:relative;width:148px;height:148px;display:grid;place-items:center}
      .boot-glow{position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,var(--accent,#e5322d) 0%,transparent 62%);opacity:0;animation:boot-glow 3.2s ease-in-out infinite alternate}
      .boot-logo{position:relative;animation:boot-spin 4.5s cubic-bezier(.45,.05,.55,.95) infinite}
      .boot-ring{stroke-dasharray:0 69.1;animation:boot-draw calc(var(--boot-s)*.24) calc(var(--boot-s)*.02) cubic-bezier(.33,.9,.4,1) forwards}
      .boot-dot{transform-box:fill-box;transform-origin:center;animation:boot-pop calc(var(--boot-s)*.08) calc(var(--boot-s)*.2) cubic-bezier(.34,1.56,.64,1) both}
      .boot-name{font:650 26px/1 'Inter Variable',Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.025em;animation:boot-rise calc(var(--boot-s)*.1) calc(var(--boot-s)*.1) cubic-bezier(.22,1,.36,1) both}
      .boot-lines{position:relative;height:18px;width:260px;font:500 14px/18px 'Inter Variable',Inter,system-ui,-apple-system,sans-serif;text-align:center;opacity:.62}
      .boot-lines span{position:absolute;inset:0;opacity:0;animation:boot-line calc(var(--boot-s)*.26) cubic-bezier(.4,0,.2,1) both}
      .boot-lines span:nth-child(1){animation-delay:calc(var(--boot-s)*.12)}
      .boot-lines span:nth-child(2){animation-delay:calc(var(--boot-s)*.36)}
      .boot-lines span:nth-child(3){animation-delay:calc(var(--boot-s)*.6)}
      .boot-lines span:nth-child(4){animation-delay:calc(var(--boot-s)*.82);animation-duration:calc(var(--boot-s)*.2);animation-fill-mode:both}
      .boot-bar{position:relative;width:148px;height:3px;border-radius:3px;overflow:hidden;background:rgba(127,127,127,.2);animation:boot-rise calc(var(--boot-s)*.1) calc(var(--boot-s)*.12) cubic-bezier(.22,1,.36,1) both}
      .boot-bar::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--accent,#e5322d);transform-origin:left;transform:scaleX(0);animation:boot-fill calc(var(--boot-s)*.94) calc(var(--boot-s)*.04) cubic-bezier(.37,0,.63,1) forwards}
      .boot-skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);font:500 12px/1 'Inter Variable',Inter,system-ui,-apple-system,sans-serif;letter-spacing:.04em;text-transform:uppercase;opacity:0;animation:boot-hint .9s calc(var(--boot-s)*.15) ease-out forwards}
      .boot.boot-out{animation:boot-out .5s cubic-bezier(.4,0,1,1) forwards}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-draw{to{stroke-dasharray:51.8 17.3}}
      @keyframes boot-pop{from{transform:scale(0)}to{transform:scale(1)}}
      @keyframes boot-glow{from{opacity:.12;transform:scale(.8)}to{opacity:.34;transform:scale(1.12)}}
      @keyframes boot-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @keyframes boot-fill{to{transform:scaleX(1)}}
      @keyframes boot-line{0%{opacity:0;transform:translateY(8px)}16%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
      @keyframes boot-hint{to{opacity:.4}}
      @keyframes boot-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
      @keyframes boot-out{to{opacity:0;transform:scale(1.06)}}
      @media (prefers-reduced-motion:reduce){.boot-logo,.boot,.boot-glow,.boot-ring,.boot-dot,.boot-name,.boot-bar,.boot-bar::after,.boot-lines span,.boot-skip{animation:none!important}.boot-ring{stroke-dasharray:51.8 17.3}.boot-bar::after{transform:scaleX(1)}.boot-lines span:nth-child(n+2),.boot-skip{display:none}.boot-lines span:nth-child(1){opacity:1}}
      .boot.again{animation:none;gap:0}
    </style>
  </head>
  <body>
    <script>try{var t=localStorage.getItem('dayfold-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var a=localStorage.getItem('dayfold-accent');if(a&&/^#[0-9a-f]{6}$/i.test(a))document.documentElement.style.setProperty('--accent',a)}catch(e){}</script>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-mark">
          <div class="boot-glow"></div>
          <svg class="boot-logo" width="104" height="104" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle class="boot-ring" cx="16" cy="16" r="11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 16 16)" />
            <circle class="boot-dot" cx="8.2" cy="8.2" r="2.4" fill="var(--accent, #e5322d)" />
          </svg>
        </div>
        <div class="boot-name">%APP_NAME%</div>
        <div class="boot-lines" aria-hidden="true"><span>Planning your day</span><span>Counting down to your exams</span><span>Finding your best hours</span><span>Almost ready</span></div>
        <div class="boot-bar"></div>
        <div class="boot-skip" aria-hidden="true">Tap to skip</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
