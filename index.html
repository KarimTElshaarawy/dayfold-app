<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%APP_NAME%</title>
    <meta name="description" content="%APP_NAME%: exam countdowns and a time-blocked day, fully on your phone." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html{background:#f5f5f7}
      html[data-theme="light"]{background:#f5f5f7}
      html[data-theme="dark"]{background:#000}
      @media (prefers-color-scheme:dark){html{background:#000}}
      /* the start-up screen: the logo draws itself and spins, the glow pulses, the name rises and a bar fills (the in-app loading state reuses .boot and .boot-logo) */
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#111;animation:boot-in .45s ease-out both}
      @media (prefers-color-scheme:dark){.boot{color:#fff}}
      html[data-theme="light"] .boot{color:#111}
      html[data-theme="dark"] .boot{color:#fff}
      .boot-mark{position:relative;width:132px;height:132px;display:grid;place-items:center}
      .boot-glow{position:absolute;inset:-34%;border-radius:50%;background:radial-gradient(circle,var(--accent,#e5322d) 0%,transparent 62%);opacity:.0;animation:boot-glow 1.7s ease-out infinite}
      .boot-logo{position:relative;animation:boot-spin 1.4s cubic-bezier(.65,0,.35,1) infinite}
      .boot-ring{stroke-dasharray:0 69.1;animation:boot-draw .95s .1s cubic-bezier(.22,1,.36,1) forwards}
      .boot-dot{transform-box:fill-box;transform-origin:center;animation:boot-pop .55s .65s cubic-bezier(.34,1.56,.64,1) both}
      .boot-name{font:650 24px/1 Inter,system-ui,-apple-system,sans-serif;letter-spacing:-.02em;animation:boot-rise .7s .45s cubic-bezier(.22,1,.36,1) both}
      .boot-bar{position:relative;width:132px;height:3px;border-radius:3px;overflow:hidden;background:rgba(127,127,127,.2);animation:boot-rise .7s .6s cubic-bezier(.22,1,.36,1) both}
      .boot-bar::after{content:"";position:absolute;inset:0;border-radius:3px;background:var(--accent,#e5322d);transform-origin:left;animation:boot-fill 1.7s .15s cubic-bezier(.4,0,.2,1) forwards;transform:scaleX(0)}
      .boot.boot-out{animation:boot-out .34s cubic-bezier(.4,0,1,1) forwards}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-draw{to{stroke-dasharray:51.8 17.3}}
      @keyframes boot-pop{from{transform:scale(0)}to{transform:scale(1)}}
      @keyframes boot-glow{0%{opacity:.34;transform:scale(.55)}100%{opacity:0;transform:scale(1.25)}}
      @keyframes boot-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @keyframes boot-fill{to{transform:scaleX(1)}}
      @keyframes boot-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
      @keyframes boot-out{to{opacity:0;transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.boot-logo,.boot,.boot-glow,.boot-ring,.boot-dot,.boot-name,.boot-bar,.boot-bar::after{animation:none!important}.boot-ring{stroke-dasharray:51.8 17.3}.boot-bar::after{transform:scaleX(1)}}
      .boot.again{animation:none;gap:0}
    </style>
  </head>
  <body>
    <script>try{var t=localStorage.getItem('dayfold-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var a=localStorage.getItem('dayfold-accent');if(a&&/^#[0-9a-f]{6}$/i.test(a))document.documentElement.style.setProperty('--accent',a)}catch(e){}</script>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-mark">
          <div class="boot-glow"></div>
          <svg class="boot-logo" width="96" height="96" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle class="boot-ring" cx="16" cy="16" r="11" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 16 16)" />
            <circle class="boot-dot" cx="8.2" cy="8.2" r="2.4" fill="var(--accent, #e5322d)" />
          </svg>
        </div>
        <div class="boot-name">%APP_NAME%</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
