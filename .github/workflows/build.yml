name: Build apps

# Builds an UNSIGNED iOS .ipa (for Sideloadly) and an installable Android .apk, in the cloud.
# Identity (name, bundle id, version) comes from app.config.json; the inputs below only override it for one run.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options: [both, ios, android]
        default: both
      version:
        description: Version override (empty = app.config.json)
        required: false
        default: ''
      build:
        description: Build number override (empty = app.config.json)
        required: false
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  ios:
    name: iOS (unsigned .ipa)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'android' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve app config
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build }}
        run: |
          VERSION="$IN_VERSION"
          BUILD="$IN_BUILD"
          # a v1.2.3 tag builds version 1.2.3 unless the input overrides it
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$VERSION" ]; then echo "DAYFOLD_VERSION=$VERSION" >> "$GITHUB_ENV"; export DAYFOLD_VERSION="$VERSION"; fi
          if [ -n "$BUILD" ]; then echo "DAYFOLD_BUILD=$BUILD" >> "$GITHUB_ENV"; export DAYFOLD_BUILD="$BUILD"; fi
          node scripts/config.mjs github-env >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generate icon and splash inputs from the single source image
        run: node scripts/make-assets.mjs

      - name: Create the iOS project
        run: npx cap add ios

      - name: Generate iOS icons and splash screens
        run: npx capacitor-assets generate --ios

      - name: Apply app config to the iOS project
        run: node scripts/patch-ios.mjs

      - name: Sync web assets into the app
        run: npx cap sync ios

      - name: Build without code signing
        run: |
          set -euxo pipefail
          if [ -d ios/App/App.xcworkspace ]; then CONTAINER=(-workspace ios/App/App.xcworkspace); else CONTAINER=(-project ios/App/App.xcodeproj); fi
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .app into an .ipa
        run: |
          set -euxo pipefail
          APP_DIR=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_DIR"
          plutil -p "$APP_DIR/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleDisplayName'
          rm -rf Payload "${ARTIFACT_NAME}.ipa"
          mkdir Payload
          cp -R "$APP_DIR" Payload/
          zip -qry "${ARTIFACT_NAME}.ipa" Payload
          ls -la "${ARTIFACT_NAME}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-ios-ipa
          path: ${{ env.ARTIFACT_NAME }}.ipa
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (.apk)
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve app config
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build }}
        run: |
          VERSION="$IN_VERSION"
          BUILD="$IN_BUILD"
          # a v1.2.3 tag builds version 1.2.3 unless the input overrides it
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$VERSION" ]; then echo "DAYFOLD_VERSION=$VERSION" >> "$GITHUB_ENV"; export DAYFOLD_VERSION="$VERSION"; fi
          if [ -n "$BUILD" ]; then echo "DAYFOLD_BUILD=$BUILD" >> "$GITHUB_ENV"; export DAYFOLD_BUILD="$BUILD"; fi
          node scripts/config.mjs github-env >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generate icon and splash inputs from the single source image
        run: node scripts/make-assets.mjs

      - name: Create the Android project
        run: npx cap add android

      - name: Generate Android icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Apply app config to the Android project
        run: node scripts/patch-android.mjs

      - name: Sync web assets into the app
        run: npx cap sync android

      - name: Install Android SDK pieces
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dayfold.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/dayfold.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
                        echo "No signing key secret set: building an APK signed with the repo debug key (native/android/debug.keystore). It is the same on every build, so updates install over the old app."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/*.apk "../${ARTIFACT_NAME}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk "../${ARTIFACT_NAME}.apk"
          fi

      - name: Check the APK
        run: |
          set -euxo pipefail
          ls -la "${ARTIFACT_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "${ARTIFACT_NAME}.apk" | grep -E "^package:|application-label:"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-android-apk
          path: ${{ env.ARTIFACT_NAME }}.apk
          if-no-files-found: error
          retention-days: 30
